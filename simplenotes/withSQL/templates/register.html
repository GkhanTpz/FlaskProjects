<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">

</head>
<body>
<!-- Main container for register page -->
<div class="container mt-5">
    <!-- Centered register form container -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h4>User Register</h4>
            <!-- Flash messages display area -->
            <div class="min-height: 60px;">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert dismissible fade show mt-2" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
            <!-- Registration form with username, password and action buttons -->
            <p class="text-muted">Please fill in the fields below to create an account.</p>
            <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password:</label><br>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="mb-3">
                <label for="confirm" class="form-label">Confirm Password:</label><br>
                <input type="password" name="confirm" class="form-control" placeholder="Confirm Password" required>
            </div>
            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-person-plus"></i> Sign Up
                </button>
                <a href="{{ url_for('login') }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
