<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Simple Notes with SQLite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<!-- Header section with flash messages and user info -->
<div class="container mt-5">
    <!-- Flash messages display area and user logout section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="min-height: 60px;">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert dismissible fade show mt-2" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
        <div class="d-flex align-items-center gap-2">
            <div class="d-flex align-items-center">
                <i class="bi bi-person-circle me-1 text-primary"></i>
                <h6 class="fw-semibold text-dark text-capitalize mb-0" style="letter-spacing: 1px;">
                    {{ user }}
                </h6>
            </div>
            <a href="{{ url_for('auth_bp.logout') }}" class="btn btn-outline-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
    <!-- Add note and search forms section -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <form method="POST" action="{{ url_for('notes_bp.add_note') }}" class="d-flex gap-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="text" name="note" class="form-control" placeholder="Please enter a note" required />
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Save
                </button>
            </form>
        </div>
        <div class="col-md-6 mb-3">
            <form method="GET" action="{{ url_for('notes_bp.search') }}" class="d-flex gap-2">
                <input type="text" name="q" class="form-control" placeholder="Search a keyword" required />
                <button type="submit" class="btn btn-secondary">
                    <i class="bi bi-search"></i> Search
                </button>
            </form>
        </div>
    </div>
    <!-- Notes display list with edit and delete options -->
    <h4>Notlar:</h4>
    <ul class="list-group">
        {% for id, note in notes %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ note }}
                <div>
                    <form method="POST" action="{{ url_for('notes_bp.delete_note', id=id)}}" class="d-inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </form>
                    <form method="GET" action="{{ url_for('notes_bp.edit_note', id=id) }}" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Update
                        </button>
                    </form>
                </div>
            </li>
        {% endfor %}
    </ul>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
